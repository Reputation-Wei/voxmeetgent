name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --dev
      - run: uv run pytest
      # CI runners have no microphone or Whisper model; this only checks that
      # doctor runs. Missing prerequisites are still printed in the log.
      - run: uv run meetagent doctor --report-only
